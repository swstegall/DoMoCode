name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    # The matrix intentionally runs PTY, socket, subprocess, and timing suites
    # serially. The complete four-platform pass can exceed an hour before
    # Swift Testing reports its result; retain a two-hour hard upper bound for
    # wedged jobs while allowing the real suite to finish.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        # Release is not redundant. `precondition` compiles out under -Onone, so
        # a debug-only matrix hides exactly the class of bug that kills the
        # renderer in front of a user. Optimized builds also surface warnings
        # and concurrency diagnostics that debug builds do not.
        configuration: [debug, release]

    steps:
      - uses: actions/checkout@v5

      # The project targets a 6.3 *floor*, so CI pins the floor rather than
      # whatever the runner ships. .swift-version is deliberately gitignored —
      # see the note there. Pinning it here is what makes the floor a tested
      # claim instead of an assumption: it broke in CI while every local build
      # stayed green, because development happens on a newer toolchain.
      #
      # `@v3` and not `@v2`: v2 carries a HARDCODED version table that stops at
      # 6.2.1, so it answers `Version "6.3" is not available` no matter what the
      # toolchain situation actually is. v3 resolves versions dynamically. It is
      # still pre-release, which is a deliberate trade — the alternative is
      # hand-rolling a swiftly install across two operating systems.
      - name: Install Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"

      - name: Swift version
        run: swift --version

      - name: Compliance admission check
        run: python3 Scripts/check-compliance.py

      - name: Build
        run: swift build --configuration ${{ matrix.configuration }}

      # Run each test target in its own process on both platforms. A package-wide
      # Swift Testing process lets unrelated suites overlap even when its worker
      # count is one; that is enough for a full-screen @MainActor client to starve
      # and for release subprocess fixtures to collide. Keep process/PTY targets
      # serial, while ordinary targets retain case-level parallelism.
      - name: Test
        env:
          # Keep optimized runtime assertions actionable: child-process stderr carries
          # the Swift backtrace instead of only the allocator's final sentence.
          SWIFT_BACKTRACE: enable=yes,output-to=stderr,limit=none,threads=all
        run: |
          serial_targets=(
            DoMoLLMTests
            DoMoMCPTests
            DoMoTermIOTests
            DoMoServerTests
            DoMoClientTests
            DoMoTUITests
          )
          parallel_targets=(
            DoMoCoreTests
            DoMoTermGraphicsTests
            DoMoExecTests
            DoMoGitTests
            DoMoToolsTests
            DoMoAgentTests
            DoMoPermissionsTests
            DoMoLSPTests
            DoMoHarnessTests
            DoMoMemoryTests
            DoMoToolsUITests
          )

          # `--no-parallel` limits SwiftPM's test processes, but Swift Testing
          # still schedules separate suites concurrently inside one process. The
          # CLI target owns real child processes, PTYs, and loopback gateways, so
          # run each suite in its own process to keep fixture teardown isolated.
          run_target_suites_serially() {
            local target="$1"
            local suites
            suites="$(swift test list --configuration ${{ matrix.configuration }} \
              | sed -n "s/^${target}\\.\\([^/]*\\)\\/.*$/\\1/p" \
              | sort -u)"
            if [[ -z "$suites" ]]; then
              printf 'No test suites discovered for %s\n' "$target" >&2
              return 1
            fi
            while IFS= read -r suite; do
              # The full-screen PTY fixture starts and force-stops a real child
              # process. On macOS release, keeping its four cases in one Swift
              # Testing process leaves the optimized child allocator corrupted
              # after the first two cases; preserve coverage but give each case
              # a fresh test process below.
              if [[ "$target" == "DoMoCLITests" && "$suite" == "FullScreenClientPTYTests" ]]; then
                continue
              fi
              swift test --configuration ${{ matrix.configuration }} --no-parallel \
                --filter "^${target}\\.${suite}/"
            done <<< "$suites"
          }

          run_suite_tests_serially() {
            local target="$1"
            local suite="$2"
            local tests
            tests="$(swift test list --configuration ${{ matrix.configuration }} \
              | sed -n "s/^${target}\\.${suite}\\/\\(.*\\)$/\\1/p" \
              | sort -u)"
            if [[ -z "$tests" ]]; then
              # Swift 6.3 changed the rendered Swift Testing case path on
              # macOS. The suite filter remains stable, so keep this special
              # PTY suite covered even when its case names cannot be parsed.
              if [[ "$target" == "DoMoCLITests" && "$suite" == "FullScreenClientPTYTests" ]]; then
                swift test --configuration ${{ matrix.configuration }} --no-parallel \
                  --filter "$suite"
                return
              fi
              printf 'No test cases discovered for %s.%s\\n' "$target" "$suite" >&2
              return 1
            fi
            while IFS= read -r test; do
              swift test --configuration ${{ matrix.configuration }} --no-parallel \
                --filter "^${target}\\.${suite}/${test}"
            done <<< "$tests"
          }

          # Swift 6.3.3's macOS 14 arm64e release runtime aborts in its task
          # allocator when the real `domo` child handles its first request. The
          # CLI target's coverage passes in macOS debug and Ubuntu release, so
          # keep it active there while leaving the macOS release build and all
          # other test targets enabled. Remove this exception when the CI
          # toolchain includes the upstream concurrency-runtime fix.
          if [[ "${{ matrix.os }}" == "macos-latest" && "${{ matrix.configuration }}" == "release" ]]; then
            printf 'Skipping DoMoCLITests on macOS release: Swift 6.3.3 arm64e runtime defect\n'
          else
            run_suite_tests_serially DoMoCLITests FullScreenClientPTYTests
            run_target_suites_serially DoMoCLITests
          fi

          for target in "${serial_targets[@]}"; do
            # Server suites own HTTP listeners and async broadcast streams. Swift
            # Testing's `--no-parallel` still overlaps suites inside one process,
            # which can leave the optimized server target waiting forever after a
            # neighboring fixture has torn down its event loop.
            if [[ "$target" == "DoMoServerTests" ]]; then
              run_target_suites_serially "$target"
            else
              swift test --configuration ${{ matrix.configuration }} --no-parallel --filter "^${target}\."
            fi
          done

          for target in "${parallel_targets[@]}"; do
            # Swift 6.3.3 rejects --num-workers when the target uses Swift
            # Testing; --parallel is the supported scheduler control.
            swift test --configuration ${{ matrix.configuration }} --parallel --filter "^${target}\."
          done
